map ctrl+shift+enter new_window_with_cwd
map ctrl+t new_tab_with_cwd
# map ctrl+l no_op

input_delay 0
confirm_os_window_close 0

linux_display_server auto

wheel_scroll_min_lines 0
scrollback_lines 3000

enable_audio_bell no

window_padding_width 4
close_on_child_death yes

cursor_shape block
cursor_shape_unfocused hollow
# cursor none
cursor_blink_interval 1 ease-in-out
# cursor_trail 1
# cursor_trail_color #c4a7e7
shell_integration no-cursor
strip_trailing_spaces smart

mouse_hide_wait 1
notify_on_cmd_finish invisible 10.0 command notify-send -i kitty "Job finished, status: %s" %c


tab_bar_style powerline
tab_title_max_length 25
tab_bar_edge top
tab_title_template "({index}) {title}"
active_tab_font_style bold
# active_tab_foreground #1d2021
# active_tab_background #a89984
# inactive_tab_foreground #ebdbb2
# inactive_tab_background #3c3836
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

show_hyperlink_targets yes
underline_hyperlinks always
#background_blur 1
enabled_layouts tall
map ctrl+shift+left resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+up resize_window taller
map ctrl+down resize_window shorter 3
map ctrl+c copy_and_clear_or_interrupt
map --allow-fallback=shifted,ascii ctrl+shift+s paste_from_selection
#map --allow-fallback=shifted,ascii ctrl+v paste_from_clipboard
copy_on_select yes

include font.conf
include themes/noctalia.conf
