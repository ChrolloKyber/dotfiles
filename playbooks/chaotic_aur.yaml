---
- name: Install Chaotic-AUR keyring and mirrorlist
  hosts: localhost
  become: true
  tasks:
    - name: Add keys
      ansible.builtin.command:
        argv:
          - pacman-key
          - --recv-key
          - "3056513887B78AEB"
          - --keyserver
          - keyserver.ubuntu.com

    - name: locally sign keys
      ansible.builtin.command:
        argv:
          - pacman-key
          - --lsign-key
          - "3056513887B78AEB"

    - name: Check whether chaotic-keyring is installed
      ansible.builtin.command:
        argv: [pacman, -Q, chaotic-keyring]
      register: chaotic_keyring
      changed_when: false
      failed_when: false

    - name: Install chaotic-keyring
      ansible.builtin.command:
        argv:
          - pacman
          - -U
          - --noconfirm
          - https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst
      when: chaotic_keyring.rc != 0
      changed_when: true

    - name: Check whether chaotic-mirrorlist is installed
      ansible.builtin.command:
        argv: [pacman, -Q, chaotic-mirrorlist]
      register: chaotic_mirrorlist
      changed_when: false
      failed_when: false

    - name: Install chaotic-mirrorlist
      ansible.builtin.command:
        argv:
          - pacman
          - -U
          - --noconfirm
          - https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst
      when: chaotic_mirrorlist.rc != 0
      changed_when: true

    - name: Add in pacman.conf
      become: true
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} ANSIBLE MANAGED CHAOTIC-AUR"
        block: |
              [chaotic-aur]
              Include = /etc/pacman.d/chaotic-mirrorlist
