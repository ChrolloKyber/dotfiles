---
- name: Install yay
  hosts: localhost
  connection: local
  become: false
  vars:
    home: "{{ lookup('env', 'HOME') }}"
    yay_dir: "{{ home }}/.cache/yay-build/"
  tasks:
    - name: Install git
      become: true
      pacman:
        name: git
        state: present
        update_cache: true

    - name: Create build directory
      file:
        path: "{{ yay_dir }}"
        state: directory
        mode: "0755"

    - name: Clone repo
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay-bin.git
        dest: "{{ yay_dir }}"
        update: false

    - name: Make and install package
      ansible.builtin.command: makepkg --noconfirm --force
      args:
        chdir: "{{ yay_dir }}"

    - name: Find built package
      ansible.builtin.find:
        paths: "{{ yay_dir }}"
        patterns: "yay-bin*.pkg.tar.zst"
      register: yay_pkg

    - name: Install package
      become: true
      ansible.builtin.command:
        cmd: "pacman -U --noconfirm {{ yay_pkg.files[0].path }}"
      when: yay_pkg.matched > 0
